<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8">
    <title>Detalle sobrantes</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.css">
    <style>
    
      .oculto{
          display: none;
      }
      
      .edit_btn{
        margin-left: 5px;
      }
    
    </style>
  </head>
  <body>
      <div class="container">
          <h1>Detalle de sobrantes</h1>
          <input type="hidden" id="inpFolio" value="0">
          <div>
            <div style="float:left; margin-left: 5px;">
              <div>Clave:</div>
              <div>
                <input type="text" id="inpClave" class="input-small"autofocus>
              </div>
            </div>
            <div style="float:left; margin-left: 5px;">
              <div>Descripcion:</div>
              <div>
                <input type="text" id="inpDescripcionM" class="input" readonly>
              </div>
            </div>
            <div style="float:left; margin-left: 20px;">
              <div>Activo:</div>
              <div>
                <select id="inpActivo">
                    <option>Si</option>
                    <option>No</option>
                </select>
              </div>
            </div>
          </div>
      
          <table id="gridLista" class="table">
        
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Nombre</th>
                    <th></th>
                </tr>
                <tr>
                    <th><input type="text" id="inpProducto"></th>
                    <th><input type="text" readonly id="inpDescripcion"></th>
                    <th><button class="btn" id="btnAgregar" style="margin-bottom: 10px;"><i class="icon-plus"></i></button></th>
                </tr>
            </thead>
            <tbody id="tbody">
            </tbody>
        
        </table>
        <div>
          <button id="btnAceptar" class="btn">Aceptar</button>&nbsp;<button id="btnCancelar" class="btn">Cancelar</button>
        </div>
      </div>

    <script type="application/dart" src="detalle_sobrantes.dart"></script>
    <script src="packages/browser/dart.js"></script>
  </body>
</html>
