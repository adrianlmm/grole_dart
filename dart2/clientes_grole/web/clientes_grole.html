<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8">
    <title>Clientes grole</title>
    <link href="/clientes_grole/web/styles/bootstrap/css/bootstrap.css" rel="stylesheet">
  </head>
  <body>
    <div class="container">
        <h2>Clientes Grole</h2>
    
        <div style="margin-bottom: 5px;">
            <button class="btn" id="btnNuevo"><i class="icon-plus"></i></button>&nbsp;<button class="btn" id="btnBuscar"><i class="icon-search"></i></button>
        </div>
        
        <div>
            <table class="table" id="tablaClientes">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
                <tfoot>
                </tfoot>
            </table>
        </div>
     </div>
     <div id="mdlNuevo" style="display: none">
        <div id="mdlNuevo-body" style="width: 500px; height: 300px; padding-left: 50px !important;">
            <h3>Nuevo cliente</h3>
            <div>
                Nombre:
            </div>
            <div>
                <input type="text" id="inpCliente" class="input-xlarge">
            </div>
            <div>
                <input type="button" id="btnAceptarCliente" value="Aceptar" class="btn">&nbsp;<input type="button" id="btnCancelarCliente" value="Cancelar" class="btn">
            </div>
        </div>
     </div>
     <div id="mdlEditar" style="display: none">
        <div id="mdlEditar-body" style="width: 500px; height: 300px; padding-left: 50px !important;">
            <h3>Editar cliente</h3>
            <div>
                Nombre:
            </div>
            <div>
                <input type="hidden" id="inpClaveClienteEditar">
                <input type="text" id="inpClienteEditar" class="input-xlarge">
            </div>
            <div>
                <input type="button" id="btnAceptarClienteEditar" value="Aceptar" class="btn">&nbsp;<input type="button" id="btnCancelarClienteEditar" value="Cancelar" class="btn">
            </div>
        </div>
     </div>   
     <div id="mdlBuscar" style="display: none">
        <div id="mdlBuscar-body" style="width: 500px; height: 300px; padding-left: 50px !important;">
            <h3>Buscar Cliente</h3>
            <div>
                Nombre:
            </div>
            <div>
                <input type="text" id="inpBuscar">
            </div>
            <div>
                <input type="button" id="btnAceptarBusqueda" value="Aceptar" class="btn">&nbsp;<input type="button" id="btnCancelarBusqueda" value="Cancelar" class="btn">
            </div>
        </div>
     </div>
        
    <script type="application/dart" src="clientes_grole.dart"></script>
    <script src="packages/browser/dart.js"></script>
  </body>
</html>
