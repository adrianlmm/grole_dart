<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="scaffolded-by" content="https://github.com/google/stagehand">
    <title>programacion</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="programacion.dart" type="application/dart"></script>
    <script defer src="packages/browser/dart.js"></script>
</head>

<body>
    <input type="hidden" id="inpId" value="4">
    <input type="hidden" id="inpIdUsuario" value="4">
    <input type="hidden" id="inpNombreUsuario" value="sistemas">

    <div>

        <div style="float: left; width: 140px;">
            <div>
                Fecha Inicial:
            </div>
            <div>
                <input type="text" id="inpFechaInicial" value="09/21/2016"/>
            </div>
        </div>
        <div style="float: left; width: 300px;">
            <div>
                Fecha Final:
            </div>
            <div>
                <input type="text" id="inpFechaFinal" value="09/25/2016"/>
            </div>
        </div>
        <div style="clear: both;">
            <div>
                Descripción:
            </div>
            <div>
                <input type="text" id="inpDescripcion" value="" style="width: 250px;"/>
            </div>
        </div>

    </div>

    <div>

        <table id="tablaDetalle" style="width: 30%;">
            <thead>
                <tr>
                    <th style="text-align: left">Clave</th>
                    <th style="text-align: left">Descripción</th>
                    <th style="text-align: right">Cajas</th>
                    <th style="text-align: right">Kilos</th>
                    <th></th>
                </tr>
                <tr>
                    <th style="text-align: left"><input type="text" id="inpProducto0" value=""/></th>
                    <th style="text-align: left"><input type="text" id="inpDescripcion0" value="" readonly="readonly"/></th>
                    <th><input type="text" id="inpCajas0" value="1" style="text-align: right"/></th>
                    <th><input type="text" id="inpKilos0" value="0" style="text-align: right"/></th>
                    <th style="text-align: center"><button id="btnAgregar" style="font-weight: bold;">+</button></th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>


    </div>
    <div>
        <button id="btnGuardar">Guardar</button>&nbsp;<button id="btnCancelar">Cancelar</button>
    </div>

</body>
<script src="/dart/programacion.dart.js"></script>
</html>
