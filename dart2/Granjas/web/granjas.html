<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8">
    <title>granja</title>
    <link rel='stylesheet' href="granjas.css">
  </head>
  <body>
    <h1>granja</h1>
    <div id='sample_container_id'>
      <div>
        <div><input type="button" value="Modificar" id="btnPermiteEdicion" on-click="modificar()"></div>
      </div>
      <div class="cnt">
        <table class="datatable">
          <thead>
            <tr>
              <th style="width: 100px;">Clave</th>
              <th style="width: 200px;">Nombre</th>
              <th template instantiate="if modo_insercion || permite_edicion"></th>
            </tr>
            <tr template instantiate="if permite_edicion">
              <th><input type="text" id="clave" value="0" disabled="disabled" style="width: 100px;"></th>
              <th><input type="text" id="nombre" value="" style="width: 200px;"></th>
              <th template instantiate="if permite_edicion"><input type="button" id="btnAgregar" value="Agregar" on-click="agregar()"><template instantiate="if !modo_insercion"><input type="button" id="btnCancelar" value="Cancelar" on-click="cancelar()"></template></th>
            </tr>
          </thead>
          <tbody template iterate="item in lista_granja">
            <tr template instantiate="if modo_insercion">
              <td>{{item.clave}}</td>
              <td>{{item.nombre}}</td>
              <td template instantiate="if modo_insercion && permite_edicion"><a href="#" on-click="eliminar(item);" class="boton_eliminar">x</a>  <a href="#" on-click="editar(item);" class="boton_editar">m</a></td>
            </tr>
          </tbody>
          <tfoot>
          </tfoot>
        </table>
      </div>
    </div>
    <script type="application/dart" src="granjas.dart"></script>
    <script src="packages/browser/dart.js"></script>
  </body>
</html>
